; Limiti PHP per il sito, letti da PHP-FPM/FastCGI (Plesk). Ignorato da mod_php.
; Laravel valida max 10 MB per immagine (PostController::IMAGE_RULES): qui serve
; margine sul singolo file e spazio per più immagini nello stesso invio.
upload_max_filesize = 12M
post_max_size = 64M
max_file_uploads = 20
; GD decodifica una foto da 24 MP in ~100 MB di RAM durante il ridimensionamento.
memory_limit = 256M
